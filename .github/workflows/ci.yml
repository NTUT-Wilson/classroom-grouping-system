name: Foundation verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: classroom_grouping
          POSTGRES_USER: classroom_local
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U classroom_local -d classroom_grouping'
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install, tests and build
        working-directory: frontend
        run: |
          npm ci --no-fund
          npm test
          npm run build
      - name: Backend integration, security, architecture tests and packaging
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - name: Browser prerequisites
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Generate synthetic roster credentials
        run: |
          for key in ROSTER_TEACHER_PASSWORD ROSTER_STUDENT_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Real-backend browser smoke test
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/classroom_grouping
          DATABASE_USERNAME: classroom_local
          DATABASE_PASSWORD: ci-only-password
          DEMO_USERNAME: ci-demo
          DEMO_PASSWORD: ci-only-foundation-password
        run: |
          java -jar backend/target/classroom-grouping-0.0.1-SNAPSHOT.jar --spring.profiles.active=local --app.demo.enabled=true --app.roster.enabled=true > backend/target/browser-backend.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/actuator/health
          cd frontend
          npm run test:e2e
      - name: Verify single application image
        env:
          DEMO_USERNAME: ci-demo
          DEMO_PASSWORD: ci-only-foundation-password
          E2E_BASE_URL: http://127.0.0.1:8081
        run: |
          docker build --tag classroom-grouping:ci .
          CONTAINER=$(docker run --rm -d --network host --memory=512m \
            -e SPRING_PROFILES_ACTIVE=local -e SERVER_ADDRESS=127.0.0.1 -e PORT=8081 \
            -e DATABASE_URL=jdbc:postgresql://127.0.0.1:5432/classroom_grouping \
            -e DATABASE_USERNAME=classroom_local -e DATABASE_PASSWORD=ci-only-password \
            -e APP_DEMO_ENABLED=true -e DEMO_USERNAME -e DEMO_PASSWORD \
            -e APP_ROSTER_ENABLED=true -e ROSTER_TEACHER_PASSWORD -e ROSTER_STUDENT_PASSWORD \
            -e SCHEDULER_SECRET=ci-only-scheduler-secret-at-least-32-bytes classroom-grouping:ci)
          trap 'docker stop "$CONTAINER"' EXIT
          test "$(docker exec "$CONTAINER" id -u)" = 10001
          for attempt in $(seq 1 90); do
            if curl --fail --silent "$E2E_BASE_URL/actuator/health" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$E2E_BASE_URL/actuator/health"
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST "$E2E_BASE_URL/internal/scheduler/tick")" = 401
          test "$(curl --silent -o /dev/null -w '%{http_code}' -X POST \
            -H 'Authorization: Bearer ci-only-scheduler-secret-at-least-32-bytes' \
            "$E2E_BASE_URL/internal/scheduler/tick")" = 501
          cd frontend
          npm run test:e2e
